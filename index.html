function setup(){document.querySelector('#tabs').innerHTML=tabs.map(x=>`<button class="tab ${x===filter?'on':''}" data-t="${x}">${x}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.t;pos=0;setup();rebuild()});let cs=['全部章节',...new Set(BANK.map(x=>x.chapter))];let sel=document.querySelector('#chapter');sel.innerHTML=cs.map(x=>`<option>${x}</option>`).join('');sel.value=chapter;sel.onchange=()=>{chapter=sel.value;pos=0;rebuild()}}

function submit(q){if(!picked.length)return;let fb=document.querySelector('#fb');if(q.graded){let a=[...picked].sort().join(''),correct=[...q.answer].sort().join('');let ok=a===correct;saved.done[q.id]=ok;if(ok)delete saved.wrong[q.id];else saved.wrong[q.id]=true;save();document.querySelectorAll('.opt').forEach(x=>{let k=x.dataset.k;if(correct.includes(k))x.classList.add('correct');else if(picked.includes(k))x.classList.add('wrong')});fb.className='feedback show '+(ok?'ok':'bad');fb.innerHTML=ok?`回答正确 · 答案 ${esc(q.answer)}`:`回答错误 · 正确答案 ${esc(q.answer)}`;}else{fb.className='feedback show info';fb.innerHTML='这份题目摘录没有保留本题标准答案。请根据课件/学习结果自行判断，然后点下面“我答对了”或“我答错了”。';document.querySelector('#self').classList.add('show')}}
function selfMark(q,ok){saved.done[q.id]=ok;if(ok)delete saved.wrong[q.id];else saved.wrong[q.id]=true;save();if(filter==='未练'||filter==='错题')rebuild();else render()}
document.querySelector('#search').oninput=e=>{search=e.target.value.trim();pos=0;rebuild()};document.querySelector('#prev').onclick=()=>{if(list.length){pos=(pos-1+list.length)%list.length;render()}};document.querySelector('#next').onclick=()=>{if(list.length){pos=(pos+1)%list.length;render()}};document.querySelector('#randomBtn').onclick=()=>{random=!random;document.querySelector('#randomBtn').textContent=random?'随机练习':'顺序练习';pos=0;rebuild()};
setup();rebuild();stats();
</script></body></html>
